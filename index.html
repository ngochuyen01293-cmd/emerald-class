<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Emerald's Class – Nhật ký lớp học</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#2b2a26; --paper:#faf7f0; --card:#ffffff; --line:#e4dfd1;
    --moss:#5a7d5a; --moss-dark:#3f5c3f; --clay:#b5652f; --danger:#b0392f;
    --sky:#eaf5fb; --sun:#f6b93b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:20px 16px 60px; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.5; max-width:480px; margin-inline:auto;
  }
  h1{ font-size:20px; font-weight:600; margin:0 0 4px; }
  .sub{ color:#6b675c; font-size:13px; margin:0 0 12px; }
  .banner{
    position:relative; border-radius:18px; overflow:hidden; margin-bottom:16px;
    background:linear-gradient(180deg,#bfe4f5 0%,#e8f6fb 70%,#fdf6e3 100%);
  }
  .banner svg{ display:block; width:100%; height:auto; }
  .banner-text{
    position:absolute; left:0; right:0; bottom:10px; text-align:center;
  }
  .banner-title{
    font-size:22px; font-weight:800; color:#3f5c3f; text-shadow:0 1px 0 #fff;
    margin:0;
  }
  .banner-subtitle{ font-size:12px; color:#57544a; margin:2px 0 0; }
  .warn{
    background:#fff6e6; border:1px solid #ecd9b8; border-radius:10px;
    padding:10px 12px; font-size:12px; color:#7a5c1e; margin:0 0 20px;
  }
  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab{
    flex:1; padding:10px; text-align:center; border-radius:10px; border:1px solid var(--line);
    background:var(--card); font-size:14px; font-weight:500; cursor:pointer; color:#77735f;
  }
  .tab.active{ background:var(--moss); color:#fff; border-color:var(--moss); }
  section{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  label{ display:block; font-size:13px; color:#57544a; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input[type="text"], input[type="url"], textarea, select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fdfcf9; color:var(--ink);
  }
  input[type="file"]{
    width:100%; padding:10px; border:1px dashed var(--line); border-radius:10px;
    font-size:14px; background:#fdfcf9;
  }
  input[type="range"]{ width:100%; accent-color:var(--moss); }
  .range-row{ display:flex; justify-content:space-between; font-size:12px; color:#8a8677; margin-top:2px; }
  textarea{ min-height:70px; resize:vertical; }
  .readonly{ background:#f3f0e6; color:#8a8677; }
  video{ width:100%; border-radius:10px; background:#000; margin-top:6px; display:block; }
  canvas{ display:none; }
  button{
    border:none; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:500;
    cursor:pointer; width:100%; margin-top:14px;
  }
  .btn-primary{ background:var(--moss); color:#fff; }
  .btn-secondary{ background:#eee8d8; color:var(--ink); }
  .btn-primary:disabled, .btn-secondary:disabled{ opacity:0.6; }
  .error{ color:var(--danger); font-size:13px; margin-top:8px; }
  .status{ font-size:13px; color:#6b675c; margin-top:8px; min-height:16px; }
  .hint{ font-size:12px; color:#8a8677; margin-top:6px; }
  .empty{ font-size:14px; color:#8a8677; text-align:center; padding:24px 0; }
  h2{ font-size:15px; font-weight:600; margin:0 0 10px; }

  .report-card{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, var(--sky) 0%, #ffffff 55%);
    border:1px solid var(--line); border-radius:16px; margin-top:16px;
  }
  .report-header{ position:relative; padding:16px 16px 10px; text-align:center; }
  .report-title{ font-size:15px; font-weight:700; color:var(--moss-dark); letter-spacing:0.3px; }
  .report-deco{ position:absolute; font-size:18px; opacity:0.9; }
  .deco-sun{ top:8px; right:14px; }
  .deco-star1{ top:6px; left:16px; }
  .deco-star2{ bottom:2px; left:44px; font-size:12px; }
  .report-fields{ display:flex; gap:8px; padding:0 14px 12px; flex-wrap:wrap; }
  .field-chip{
    display:flex; align-items:center; gap:6px; background:#ffffff;
    border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    font-size:13px; font-weight:500;
  }
  .field-chip .icon{ font-size:14px; }
  .report-video{ background:#000; }
  .report-video video{ margin:0; border-radius:0; max-height:260px; }
  .report-note{
    margin:14px; padding:14px 16px; background:#fffdf6;
    border:1px solid #ecd9b8; border-radius:12px; font-size:14px; white-space:pre-wrap;
    position:relative;
  }
  .report-note::before{
    content:"✎"; position:absolute; top:-10px; left:14px; background:var(--sun);
    color:#fff; width:22px; height:22px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:12px;
  }
  .report-date{ font-size:12px; color:#8a8677; padding:0 16px 14px; }
</style>
</head>
<body>

  <div class="banner">
    <svg viewBox="0 0 480 150" xmlns="http://www.w3.org/2000/svg">
      <circle cx="400" cy="34" r="26" fill="#f6b93b"/>
      <g stroke="#f6b93b" stroke-width="4" stroke-linecap="round">
        <line x1="400" y1="-2" x2="400" y2="6"/>
        <line x1="400" y1="62" x2="400" y2="70"/>
        <line x1="366" y1="34" x2="358" y2="34"/>
        <line x1="442" y1="34" x2="450" y2="34"/>
        <line x1="376" y1="10" x2="371" y2="5"/>
        <line x1="424" y1="10" x2="429" y2="5"/>
        <line x1="376" y1="58" x2="371" y2="63"/>
        <line x1="424" y1="58" x2="429" y2="63"/>
      </g>
      <ellipse cx="60" cy="40" rx="34" ry="16" fill="#ffffff"/>
      <ellipse cx="88" cy="34" rx="26" ry="14" fill="#ffffff"/>
      <ellipse cx="140" cy="55" rx="30" ry="14" fill="#ffffff"/>
      <ellipse cx="165" cy="48" rx="20" ry="11" fill="#ffffff"/>
      <path d="M0 150 L0 110 Q40 90 90 108 T190 106 T290 112 T390 104 T480 112 L480 150 Z" fill="#eafaf0"/>
      <circle cx="40" cy="100" r="5" fill="#ef8577"/>
      <circle cx="60" cy="90" r="4" fill="#f6b93b"/>
      <circle cx="440" cy="95" r="5" fill="#7fae7f"/>
      <path d="M230 60 l4 8 9 1 -6.5 6.3 1.5 9 -8-4.5 -8 4.5 1.5-9L217 69l9-1z" fill="#ef8577"/>
      <path d="M290 30 l3 6 6.5 1 -4.7 4.6 1.1 6.6 -5.9-3.1 -5.9 3.1 1.1-6.6L281 37l6.5-1z" fill="#5a7d5a"/>
      <ellipse cx="120" cy="118" rx="7" ry="9" fill="#ef8577"/>
      <line x1="120" y1="127" x2="120" y2="136" stroke="#b5652f" stroke-width="1.5"/>
      <ellipse cx="350" cy="122" rx="7" ry="9" fill="#7fae7f"/>
      <line x1="350" y1="131" x2="350" y2="140" stroke="#b5652f" stroke-width="1.5"/>
    </svg>
    <div class="banner-text">
      <p class="banner-title">The Emerald's Class</p>
      <p class="banner-subtitle">Nhật ký lớp học · Class journal</p>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabTeacher">Giáo viên / Teacher</div>
    <div class="tab" id="tabParent">Phụ huynh / Parent</div>
  </div>

  <!-- TEACHER VIEW -->
  <div id="teacherView">
    <section>
      <h2>1. Chọn và cắt video / Choose &amp; trim video</h2>
      <input type="file" id="videoFile" accept="video/*">
      <video id="sourceVideo" playsinline preload="metadata" controls onerror="window.reportVidErr(this)"></video>

      <label for="startInput">Cắt từ giây (để trống = từ đầu) / Trim from second (blank = from start)</label>
      <input type="number" id="startInput" min="0" step="0.5" placeholder="VD/E.g. 2">

      <label for="endInput">Đến giây (để trống = đến hết) / To second (blank = to the end)</label>
      <input type="number" id="endInput" min="0" step="0.5" placeholder="VD/E.g. 8">
      <div class="error" id="trimError"></div>
    </section>

    <section>
      <h2>2. Thông tin gửi phụ huynh / Info for parents</h2>
      <label for="studentInput">Tên học sinh / Student's name</label>
      <input type="text" id="studentInput" list="studentList" placeholder="VD/E.g.: Bé Minh Anh">
      <datalist id="studentList"></datalist>

      <label for="classInput">Lớp / Class</label>
      <input type="text" id="classInput" placeholder="VD/E.g.: Penguin 1">

      <label>Ngày / Date</label>
      <input type="text" class="readonly" id="todayDisplay" readonly>

      <label for="noteInput">Nhận xét về bé / Note about the child</label>
      <textarea id="noteInput" placeholder="Hôm nay bé... / Today, ..."></textarea>

      <button class="btn-primary" id="postBtn">Đăng cho phụ huynh xem / Post for parents</button>
      <div class="error" id="postError"></div>
      <div class="status" id="postStatus"></div>
    </section>

    <section>
      <h2>Đã đăng gần đây / Recent posts</h2>
      <div id="teacherFeed"><div class="empty">Chưa có bài nào. / No posts yet.</div></div>
    </section>
  </div>

  <!-- PARENT VIEW -->
  <div id="parentView" style="display:none;">
    <section>
      <h2>Xem video của con / Watch your child's video</h2>
      <label for="parentStudentSelect">Chọn học sinh / Choose student</label>
      <select id="parentStudentSelect"></select>
    </section>
    <div id="parentFeed"></div>
  </div>
  <canvas id="canvas"></canvas>

<script>
/* ========== CẤU HÌNH FIREBASE — điền thông tin dự án của bạn vào đây ==========
   Vào console.firebase.google.com → dự án của bạn → biểu tượng bánh răng
   → Project settings → cuộn xuống "Your apps" → copy đoạn firebaseConfig, dán đè vào bên dưới. */
const firebaseConfig = {
  apiKey: "AIzaSyA_SqYiEsf3MKwLX2SSTPgAt8MdrSrFmRQ",
  authDomain: "emerald-class.firebaseapp.com",
  projectId: "emerald-class",
  storageBucket: "emerald-class.firebasestorage.app",
  messagingSenderId: "213482288475",
  appId: "1:213482288475:web:b2acd36d4820a9411e567e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ========== CẤU HÌNH CLOUDINARY — nơi lưu trữ video (miễn phí, không cần thẻ) ==========
   Vào cloudinary.com → Dashboard → copy "Cloud name" và "API Key" (Settings → API Keys) */
const CLOUDINARY_CLOUD_NAME = "jga7i2hk";
const CLOUDINARY_API_KEY = "159834379921547";

/* ========== CẤU HÌNH GOOGLE APPS SCRIPT — "người gác cổng" cho phép cắt video ==========
   Dán URL Web App sau khi deploy (script.google.com) vào đây */
const SIGN_ENDPOINT = "https://script.google.com/macros/s/AKfycbyS28wsOFWvu_6yJVmk96IL06YnJusLXMhkKOyEWFw7SResoujcGO1AUUecb2WolapaYA/exec";

async function uploadVideoToCloudinary(blob, startSec, endSec){
  // Ghép chuỗi transformation: cắt (nếu có) + luôn chuyển sang H.264/mp4 chuẩn
  const parts = [];
  if(startSec !== null) parts.push('so_' + startSec);
  if(endSec !== null) parts.push('eo_' + endSec);
  parts.push('f_mp4', 'vc_h264');
  const eager = parts.join(',');

  // Xin chữ ký từ "người gác cổng" (Google Apps Script) trước khi tải lên
  const signRes = await fetch(SIGN_ENDPOINT + '?eager=' + encodeURIComponent(eager));
  if(!signRes.ok){
    const errText = await signRes.text().catch(() => '');
    throw new Error('Không lấy được chữ ký (status ' + signRes.status + '): ' + errText.slice(0,200));
  }
  const signData = await signRes.json();

  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`;
  const formData = new FormData();
  formData.append('file', blob);
  formData.append('api_key', CLOUDINARY_API_KEY);
  formData.append('timestamp', signData.timestamp);
  formData.append('signature', signData.signature);
  formData.append('eager', eager);

  const res = await fetch(url, { method: 'POST', body: formData });
  if(!res.ok){
    const errText = await res.text();
    throw new Error('Cloudinary: ' + errText);
  }
  const data = await res.json();
  // Tải lên có ký xác nhận sẽ tạo sẵn bản đã cắt/chuyển đổi ngay lập tức (không phải "theo yêu cầu"),
  // nên phát ổn định trên mọi điện thoại
  if(data.eager && data.eager[0] && data.eager[0].secure_url){
    return data.eager[0].secure_url;
  }
  return data.secure_url;
}
/* ================================================================================ */

/* ---------- (Firestore/Storage thay thế bộ nhớ tạm trước đây) ---------- */

/* ---------- Tabs ---------- */
const tabTeacher = document.getElementById('tabTeacher');
const tabParent = document.getElementById('tabParent');
const teacherView = document.getElementById('teacherView');
const parentView = document.getElementById('parentView');

tabTeacher.onclick = () => {
  tabTeacher.classList.add('active'); tabParent.classList.remove('active');
  teacherView.style.display = 'block'; parentView.style.display = 'none';
};
tabParent.onclick = () => {
  tabParent.classList.add('active'); tabTeacher.classList.remove('active');
  parentView.style.display = 'block'; teacherView.style.display = 'none';
  renderParentView();
};

const todayDisplay = document.getElementById('todayDisplay');
const today = new Date();
const todayStr = today.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });
todayDisplay.value = todayStr;

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function fmt(t){
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ':' + String(s).padStart(2,'0');
}
function describeVideoError(err){
  if(!err) return 'Không rõ lỗi / Unknown error';
  const map = {
    1: 'MEDIA_ERR_ABORTED (bị huỷ giữa chừng)',
    2: 'MEDIA_ERR_NETWORK (lỗi tải dữ liệu)',
    3: 'MEDIA_ERR_DECODE (dữ liệu video lỗi/hỏng)',
    4: 'MEDIA_ERR_SRC_NOT_SUPPORTED (định dạng không được hỗ trợ)'
  };
  return (map[err.code] || ('code ' + err.code));
}
window.reportVidErr = function(videoEl){
  const msg = describeVideoError(videoEl.error);
  let errDiv = videoEl.parentElement.querySelector('.video-err');
  if(!errDiv){
    errDiv = document.createElement('div');
    errDiv.className = 'error video-err';
    errDiv.style.margin = '8px 14px 0';
    videoEl.insertAdjacentElement('afterend', errDiv);
  }
  errDiv.textContent = 'Lỗi phát video / Video error: ' + msg;
};

/* ---------- Choose & post video ---------- */
const videoFile = document.getElementById('videoFile');
const sourceVideo = document.getElementById('sourceVideo');
const trimError = document.getElementById('trimError');
const postBtn = document.getElementById('postBtn');

videoFile.addEventListener('change', () => {
  const file = videoFile.files[0];
  if(!file) return;
  sourceVideo.src = URL.createObjectURL(file);
  sourceVideo.load();
  trimError.textContent = '';
  const oldVidErr = sourceVideo.parentElement.querySelector('.video-err');
  if(oldVidErr) oldVidErr.remove();
});

/* ---------- Post / feeds (dùng Firebase Firestore + Storage) ---------- */
async function refreshStudentOptions(){
  const list = document.getElementById('studentList');
  const sel = document.getElementById('parentStudentSelect');
  try{
    const snap = await db.collection('posts').get();
    const names = [...new Set(snap.docs.map(d => d.data().student))];
    list.innerHTML = names.map(s => `<option value="${escapeHtml(s)}">`).join('');
    sel.innerHTML = names.length
      ? names.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')
      : '<option value="">Chưa có học sinh nào / No students yet</option>';
  }catch(err){
    console.error(err);
  }
}

async function renderTeacherFeed(){
  const feed = document.getElementById('teacherFeed');
  feed.innerHTML = '<div class="empty">Đang tải... / Loading...</div>';
  try{
    const snap = await db.collection('posts').orderBy('createdAt', 'desc').limit(5).get();
    if(snap.empty){
      feed.innerHTML = '<div class="empty">Chưa có bài nào. / No posts yet.</div>';
      return;
    }
    feed.innerHTML = snap.docs.map(d => postToHtml(d.data())).join('');
  }catch(err){
    feed.innerHTML = '<div class="error">Không tải được danh sách: ' + escapeHtml(err.message) + '</div>';
  }
}

function renderParentView(){
  refreshStudentOptions();
  const sel = document.getElementById('parentStudentSelect');
  sel.onchange = renderParentFeed;
}

async function renderParentFeed(){
  const sel = document.getElementById('parentStudentSelect');
  const chosen = sel.value;
  const feed = document.getElementById('parentFeed');
  if(!chosen){
    feed.innerHTML = '<div class="empty">Chưa có video nào cho bé này. / No videos for this child yet.</div>';
    return;
  }
  feed.innerHTML = '<div class="empty">Đang tải... / Loading...</div>';
  try{
    const snap = await db.collection('posts').where('student', '==', chosen).get();
    if(snap.empty){
      feed.innerHTML = '<div class="empty">Chưa có video nào cho bé này. / No videos for this child yet.</div>';
      return;
    }
    const docs = snap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    feed.innerHTML = docs.map(postToHtml).join('');
  }catch(err){
    feed.innerHTML = '<div class="error">Không tải được video: ' + escapeHtml(err.message) + '</div>';
  }
}

function postToHtml(p){
  const className = p.className || '';
  return `
    <div class="report-card">
      <div class="report-header">
        <span class="report-deco deco-star1">✦</span>
        <span class="report-deco deco-sun">☀</span>
        <span class="report-deco deco-star2">✧</span>
        <div class="report-title">NHẬT KÝ CỦA BÉ / CHILD'S JOURNAL</div>
      </div>
      <div class="report-fields">
        <div class="field-chip"><span class="icon">🧒</span>${escapeHtml(p.student)}</div>
        ${className ? `<div class="field-chip"><span class="icon">🏫</span>${escapeHtml(className)}</div>` : ''}
      </div>
      <div class="report-video">
        ${p.videoURL ? `<video src="${p.videoURL}" controls playsinline preload="metadata" onerror="window.reportVidErr(this)"></video>` : '<div class="empty" style="color:#fff;">Không tải được video / Video unavailable</div>'}
      </div>
      <div class="report-note">${escapeHtml(p.note)}</div>
      <div class="report-date">${escapeHtml(p.date)}</div>
    </div>`;
}

postBtn.addEventListener('click', async () => {
  const postError = document.getElementById('postError');
  const postStatus = document.getElementById('postStatus');
  postError.textContent = '';
  postStatus.textContent = '';

  const student = document.getElementById('studentInput').value.trim();
  const className = document.getElementById('classInput').value.trim();
  const note = document.getElementById('noteInput').value.trim();
  const file = videoFile.files[0];

  if(!student || !note){
    postError.textContent = 'Vui lòng điền tên học sinh và nhận xét. / Please fill in the student name and note.';
    return;
  }
  if(!file){
    postError.textContent = 'Vui lòng chọn video trước khi đăng. / Please choose a video before posting.';
    return;
  }
  const startVal = document.getElementById('startInput').value.trim();
  const endVal = document.getElementById('endInput').value.trim();
  const startSec = startVal === '' ? null : parseFloat(startVal);
  const endSec = endVal === '' ? null : parseFloat(endVal);
  if(startSec !== null && endSec !== null && endSec <= startSec){
    postError.textContent = 'Giây kết thúc phải sau giây bắt đầu. / End second must come after start second.';
    return;
  }

  postBtn.disabled = true;
  postStatus.textContent = 'Đang tải video lên và cắt... / Uploading and trimming...';

  try{
    const videoURL = await uploadVideoToCloudinary(file, startSec, endSec);

    postStatus.textContent = 'Đang lưu thông tin... / Saving info...';
    await db.collection('posts').add({
      student, className, note, videoURL,
      date: todayStr,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    postStatus.textContent = 'Đã đăng — chuyển sang tab "Phụ huynh" để xem thử. / Posted — switch to the "Parent" tab to preview.';
    document.getElementById('studentInput').value = '';
    document.getElementById('classInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('startInput').value = '';
    document.getElementById('endInput').value = '';
    videoFile.value = '';
    sourceVideo.removeAttribute('src');
    await refreshStudentOptions();
    await renderTeacherFeed();
  }catch(err){
    postError.textContent = 'Không đăng được: ' + err.message + ' / Could not post: ' + err.message;
  }finally{
    postBtn.disabled = false;
  }
});

refreshStudentOptions();
renderTeacherFeed();
</script>
</body>
</html>
